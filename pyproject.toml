[project]
name = "agentguard"
version = "0.1.0"
description = "Tool-using LLM agent with guardrails, memory poisoning detection and an automated red-team harness"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["agentguard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
