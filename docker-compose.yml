services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./data:/app/data", "./results:/app/results"]
    mem_limit: 2g
    # The agent's code sandbox runs inside this container; keep it locked down.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
